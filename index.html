<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'appli dessine sous l'encoche, les marges de
         zone sûre sont gérées en CSS. user-scalable reste autorisé pour
         l'accessibilité, les champs sont à 16 px pour éviter le zoom auto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Fonte — note ta série, vois ta progression. Suivi de musculation qui marche hors ligne." />

    <!-- Couleur de la barre du navigateur, alignée sur le thème actif -->
    <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />

    <!-- iOS : plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fonte" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />

    <title>Fonte</title>
    <script>
      // Thème appliqué avant le premier rendu, pour éviter un flash clair.
      // La valeur fait foi dans la base ; localStorage n'en est que le miroir.
      try {
        var pref = localStorage.getItem('fonte.theme')
        if (pref !== 'dark' && pref !== 'light') {
          pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', pref)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <!--
      Écran de lancement rendu avant tout JavaScript : sur un téléphone
      d'entrée de gamme, attendre le bundle pour afficher quelque chose coûte
      une à deux secondes de page blanche. React remplace ce contenu en
      montant dans #root, avec le même visuel, donc sans transition visible.

      Les deux couleurs ci-dessous redoublent volontairement les jetons de
      src/styles/tokens.css : la feuille de styles n'est pas encore chargée
      au premier rendu, donc les variables n'existent pas. Toute modification
      du fond ou de l'accent doit être reportée ici.
    -->
    <style>
      #lancement {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0e0f11; /* = --fonte-bg, thème sombre */
        font-family: system-ui, sans-serif;
      }
      :root[data-theme='light'] #lancement {
        background: #f4f1ea; /* = --fonte-bg, thème clair */
      }
    </style>
    <div id="root">
      <div id="lancement">
        <svg width="128" height="128" viewBox="0 0 120 120" role="img" aria-label="Fonte">
          <rect width="120" height="120" rx="30" fill="#FF9F1C" />
          <circle cx="60" cy="60" r="40" fill="#1A1204" />
          <circle cx="60" cy="60" r="27" fill="none" stroke="#FF9F1C" stroke-width="3" />
          <circle cx="60" cy="60" r="9" fill="#FF9F1C" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
